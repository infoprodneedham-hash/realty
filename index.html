<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Billboard Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body {
            font-family: "Century Gothic", AppleGothic, sans-serif;
            background-color: #444;
            padding: 40px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fixed container to prevent jumbling */
        #billboard {
            width: 1000px;
            background-color: #ffffff;
            border: 15px solid #1976d2;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        /* Header section */
        .header {
            background-color: #d32f2f !important;
            color: #ffffff !important;
            text-align: center;
            padding: 30px;
            border-bottom: 10px solid #1976d2;
        }
        .header h1 { margin: 0; font-size: 42pt; text-transform: uppercase; }

        /* Stable Table-Based Layout for PDF */
        .content-table {
            display: table;
            width: 100%;
            border-spacing: 20px;
            border-collapse: separate;
        }
        .content-row { display: table-row; }
        .image-cell { display: table-cell; width: 600px; vertical-align: top; }
        .text-cell { display: table-cell; width: 340px; vertical-align: top; font-size: 14pt; line-height: 1.4; }

        /* Image Grouping */
        .image-container { width: 600px; }
        .large-box {
            width: 400px;
            height: 350px;
            background: #eee;
            float: left;
            margin-right: 15px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .small-box-stack { width: 180px; float: left; }
        .small-box {
            width: 180px;
            height: 167px;
            background: #eee;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .clear { clear: both; }

        /* Text Styling */
        #disp-h { color: #1976d2; font-size: 26pt; margin: 0 0 5px 0; }
        #disp-sh { color: #d32f2f; font-size: 18pt; margin: 0 0 15px 0; }
        #disp-body { font-size: 14pt; color: #333; }

        /* Footer Icons */
        .footer-bar {
            background-color: #1976d2 !important;
            color: #ffffff !important;
            padding: 20px 0;
            text-align: center;
            width: 100%;
        }
        .icon-item {
            display: inline-block;
            width: 30%;
            font-size: 22pt;
            font-weight: bold;
        }

        /* Controls Panel (Hidden from PDF) */
        .ui-panel {
            width: 1000px;
            background: #fff;
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .ui-panel button {
            grid-column: span 2;
            padding: 20px;
            background: #d32f2f;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
        }
        img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="billboard">
        <div class="header">
            <h1>Premium Property</h1>
        </div>

        <div class="content-table">
            <div class="content-row">
                <div class="image-cell">
                    <div class="image-container">
                        <div class="large-box" id="p-main"></div>
                        <div class="small-box-stack">
                            <div class="small-box" id="p-s1"></div>
                            <div class="small-box" id="p-s2"></div>
                        </div>
                        <div class="clear"></div>
                    </div>
                </div>

                <div class="text-cell">
                    <h2 id="disp-h">Property Title</h2>
                    <h3 id="disp-sh">Subheading</h3>
                    <div id="disp-body">Description will appear here after text file upload.</div>
                </div>
            </div>
        </div>

        <div class="footer-bar">
            <div class="icon-item">🛌 <span id="r-val">0</span></div>
            <div class="icon-item">🛁 <span id="b-val">0</span></div>
            <div class="icon-item">🚗 <span id="c-val">0</span></div>
        </div>
    </div>

    <div class="ui-panel">
        <div><label>Main Image:</label><br><input type="file" accept="image/*" onchange="upImg(this, 'p-main')"></div>
        <div><label>Text File (.txt):</label><br><input type="file" accept=".txt" onchange="upTxt(this)"></div>
        <div><label>Side Image 1:</label><br><input type="file" accept="image/*" onchange="upImg(this, 'p-s1')"></div>
        <div><label>Side Image 2:</label><br><input type="file" accept="image/*" onchange="upImg(this, 'p-s2')"></div>
        
        <div><label>Rooms:</label><br><select onchange="updateVal('r-val', this.value)"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
        <div><label>Baths:</label><br><select onchange="updateVal('b-val', this.value)"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
        <div><label>Cars:</label><br><select onchange="updateVal('c-val', this.value)"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>

        <button onclick="savePDF()">DOWNLOAD BILLBOARD PDF</button>
    </div>

    <script>
        function updateVal(id, val) { document.getElementById(id).innerText = val; }

        function upImg(input, target) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(target).innerHTML = `<img src="${e.target.result}">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function upTxt(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l !== "");
                    document.getElementById('disp-h').innerText = lines[0] || "Headline";
                    document.getElementById('disp-sh').innerText = lines[1] || "Subheading";
                    document.getElementById('disp-body').innerText = lines.slice(2).join(" ") || "Body";
                }
                reader.readAsText(file);
            }
        }

        async function savePDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('billboard');
            
            // html2canvas capture with settings to fix alignment
            const canvas = await html2canvas(element, {
                scale: 2,
                useCORS: true,
                logging: false,
                width: 1000, // Force the width
                windowWidth: 1000
            });

            const imgData = canvas.toDataURL('image/png');
            
            // Landscape PDF matching canvas dimensions
            const pdf = new jsPDF({
                orientation: 'l',
                unit: 'px',
                format: [canvas.width, canvas.height]
            });
            
            pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
            pdf.save("billboard-export.pdf");
        }
    </script>
</body>
</html>
