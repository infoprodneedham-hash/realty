<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Billboard Creator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --re-red: #d32f2f;
            --re-blue: #1976d2;
            --white: #ffffff;
        }

        body {
            font-family: "Century Gothic", AppleGothic, sans-serif;
            background-color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }

        /* The Main Billboard Container */
        #billboard {
            width: 900px;
            background: var(--white);
            border: 12px solid var(--re-blue);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            /* Vital for PDF rendering colors */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Header Bar */
        .billboard-header {
            background-color: var(--re-red) !important;
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 8px solid var(--re-blue);
        }

        .billboard-header h1 {
            margin: 0;
            font-size: 32pt;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Layout for Images and Text */
        .main-content {
            display: flex;
            padding: 30px;
            gap: 25px;
            background: white;
        }

        .image-section {
            display: flex;
            flex: 1.8;
            gap: 15px;
        }

        .large-pic {
            flex: 2;
            height: 350px;
            background: #f9f9f9;
            border: 2px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .small-pics-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .small-pic {
            height: 167px;
            background: #f9f9f9;
            border: 2px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        img { width: 100%; height: 100%; object-fit: cover; }

        /* Text Section */
        .text-section {
            flex: 1.2;
            font-size: 14pt;
            color: #333;
            line-height: 1.5;
            text-align: left;
        }

        .text-section h1 { color: var(--re-blue); margin: 0 0 10px 0; font-size: 26pt; }
        .text-section h2 { color: var(--re-red); margin: 0 0 20px 0; font-size: 18pt; }
        .text-section p { margin: 0; }

        /* Property Details Bar */
        .details-bar {
            background: var(--re-blue) !important;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 18pt;
            font-weight: bold;
        }

        /* UI Controls (Hidden in PDF via JS logic) */
        .controls {
            margin-top: 40px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-weight: bold; color: #555; }

        input[type="file"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button.download-btn {
            grid-column: span 2;
            padding: 20px;
            background: var(--re-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.4rem;
            transition: background 0.3s;
        }

        button.download-btn:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>

    <div id="billboard">
        <div class="billboard-header">
            <h1>FOR SALE</h1>
        </div>

        <div class="main-content">
            <div class="image-section">
                <div class="large-pic" id="large-preview">Main Image Preview</div>
                <div class="small-pics-col">
                    <div class="small-pic" id="small1-preview">Small Pic 1</div>
                    <div class="small-pic" id="small2-preview">Small Pic 2</div>
                </div>
            </div>

            <div class="text-section" id="text-display">
                <h1 id="out-h">Luxury Living</h1>
                <h2 id="out-sh">Available Now</h2>
                <p id="out-body">Upload your .txt file to fill this section with your property description.</p>
            </div>
        </div>

        <div class="details-bar">
            <span>🛏 <span id="val-rooms">1</span> Bed</span>
            <span>🚿 <span id="val-baths">1</span> Bath</span>
            <span>🚗 <span id="val-cars">1</span> Car</span>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Main Photo:</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'large-preview')">
        </div>
        <div class="control-group">
            <label>Description File (.txt):</label>
            <input type="file" accept=".txt" onchange="loadText(event)">
        </div>
        <div class="control-group">
            <label>Small Photo 1:</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'small1-preview')">
        </div>
        <div class="control-group">
            <label>Small Photo 2:</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'small2-preview')">
        </div>

        <div class="control-group">
            <label>Bedrooms:</label>
            <select onchange="updateVal('val-rooms', this.value)">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option>
            </select>
        </div>
        <div class="control-group">
            <label>Bathrooms:</label>
            <select onchange="updateVal('val-baths', this.value)">
                <option>1</option><option>2</option><option>3</option><option>4+</option>
            </select>
        </div>
        <div class="control-group">
            <label>Car Spaces:</label>
            <select onchange="updateVal('val-cars', this.value)">
                <option>1</option><option>2</option><option>3</option><option>4+</option>
            </select>
        </div>

        <button class="download-btn" onclick="downloadPDF()">DOWNLOAD BILLBOARD AS PDF</button>
    </div>

    <script>
        // Update labels instantly
        function updateVal(id, val) {
            document.getElementById(id).innerText = val;
        }

        // Image preview logic
        function previewImg(event, targetId) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const output = document.getElementById(targetId);
                output.innerHTML = `<img src="${e.target.result}">`;
            };
            reader.readAsDataURL(file);
        }

        // Read text file and split into Heading, Subheading, Body
        function loadText(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l !== "");
                if (lines.length >= 1) document.getElementById('out-h').innerText = lines[0];
                if (lines.length >= 2) document.getElementById('out-sh').innerText = lines[1];
                if (lines.length >= 3) document.getElementById('out-body').innerText = lines.slice(2).join(' ');
            };
            reader.readAsText(file);
        }

        // PDF Generation Logic
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const billboard = document.getElementById('billboard');

            // Using html2canvas to take a snapshot of the div
            // We use a high scale for print quality
            const canvas = await html2canvas(billboard, {
                scale: 3, 
                useCORS: true,
                logging: false,
                backgroundColor: "#ffffff"
            });

            const imgData = canvas.toDataURL('image/png');
            
            // Create PDF in Landscape
            const pdf = new jsPDF({
                orientation: 'landscape',
                unit: 'px',
                format: [canvas.width, canvas.height]
            });

            pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
            pdf.save("property-billboard.pdf");
        }
    </script>
</body>
</html>
