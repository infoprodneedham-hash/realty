<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Billboard Gen</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body {
            font-family: "Century Gothic", AppleGothic, sans-serif;
            background-color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }

        /* FIXED WIDTH CONTAINER - Crucial for PDF consistency */
        #billboard-wrapper {
            width: 1000px;
            background: white;
            padding: 0;
            margin: 0;
        }

        #billboard {
            width: 1000px;
            display: block; /* Removed flex to prevent shifting */
            border: 15px solid #1976d2; /* Blue Border */
            box-sizing: border-box;
            background: white;
        }

        .header {
            background-color: #d32f2f !important; /* Red */
            color: white;
            text-align: center;
            padding: 30px;
            border-bottom: 10px solid #1976d2;
        }

        .header h1 { margin: 0; font-size: 40pt; text-transform: uppercase; }

        /* Grid layout is more stable for html2canvas than Flexbox */
        .content-grid {
            display: grid;
            grid-template-columns: 600px 370px; /* Fixed sizes prevent "floating" items */
            gap: 15px;
            padding: 15px;
        }

        .left-pics {
            display: grid;
            grid-template-columns: 380px 190px;
            gap: 10px;
        }

        .large-box {
            width: 380px;
            height: 350px;
            background: #eee;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .small-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .small-box {
            width: 190px;
            height: 170px;
            background: #eee;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .text-area {
            font-size: 14pt;
            line-height: 1.4;
            color: #222;
            padding: 10px;
        }

        .text-area h2 { color: #1976d2; font-size: 24pt; margin: 0 0 5px 0; }
        .text-area h3 { color: #d32f2f; font-size: 18pt; margin: 0 0 10px 0; }

        .footer-bar {
            background: #1976d2 !important;
            color: white;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            font-size: 20pt;
            font-weight: bold;
        }

        img { width: 100%; height: 100%; object-fit: cover; }

        /* UI Panel - Hidden from PDF */
        .ui-panel {
            background: #fff;
            width: 1000px;
            margin-top: 30px;
            padding: 30px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            box-sizing: border-box;
        }

        .ui-panel button {
            grid-column: span 2;
            padding: 20px;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="billboard-wrapper">
        <div id="billboard">
            <div class="header">
                <h1>Property for Sale</h1>
            </div>

            <div class="content-grid">
                <div class="left-pics">
                    <div class="large-box" id="p-main"></div>
                    <div class="small-stack">
                        <div class="small-box" id="p-s1"></div>
                        <div class="small-box" id="p-s2"></div>
                    </div>
                </div>

                <div class="text-area">
                    <h2 id="disp-h">Headline Goes Here</h2>
                    <h3 id="disp-sh">Subheading text</h3>
                    <div id="disp-body">Upload your description text file.</div>
                </div>
            </div>

            <div class="footer-bar">
                <div>Rooms: <span id="r-val">0</span></div>
                <div>Baths: <span id="b-val">0</span></div>
                <div>Cars: <span id="c-val">0</span></div>
            </div>
        </div>
    </div>

    <div class="ui-panel">
        <div><label>Main Pic:</label><br><input type="file" onchange="upImg(this, 'p-main')"></div>
        <div><label>Text File (.txt):</label><br><input type="file" onchange="upTxt(this)"></div>
        <div><label>Side Pic 1:</label><br><input type="file" onchange="upImg(this, 'p-s1')"></div>
        <div><label>Side Pic 2:</label><br><input type="file" onchange="upImg(this, 'p-s2')"></div>
        
        <div>
            <label>Rooms:</label>
            <select onchange="document.getElementById('r-val').innerText=this.value">
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
        </div>
        <div>
            <label>Bathrooms:</label>
            <select onchange="document.getElementById('b-val').innerText=this.value">
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
            </select>
        </div>
        <div>
            <label>Car Parks:</label>
            <select onchange="document.getElementById('c-val').innerText=this.value">
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
            </select>
        </div>

        <button onclick="savePDF()">DOWNLOAD AS PDF</button>
    </div>

    <script>
        function upImg(input, target) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(target).innerHTML = `<img src="${e.target.result}">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function upTxt(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const lines = e.target.result.split('\n').filter(l => l.trim() !== "");
                    document.getElementById('disp-h').innerText = lines[0] || "Headline";
                    document.getElementById('disp-sh').innerText = lines[1] || "Subheading";
                    document.getElementById('disp-body').innerText = lines.slice(2).join(" ") || "Body";
                }
                reader.readAsText(file);
            }
        }

        async function savePDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('billboard');
            
            // Capture canvas at high resolution
            const canvas = await html2canvas(element, {
                scale: 2,
                useCORS: true,
                allowTaint: false,
                // These two settings help with element positioning
                windowWidth: 1000,
                scrollX: 0,
                scrollY: 0
            });

            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF('l', 'px', [canvas.width, canvas.height]);
            
            pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
            pdf.save("real-estate-billboard.pdf");
        }
    </script>
</body>
</html>
