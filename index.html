<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Listing Dashboard</title>
    <style>
        :root {
            --re-red: #e31b23;
            --re-blue: #0054a4;
            --white: #ffffff;
            --bg: #f4f4f4;
        }

        body {
            font-family: "Century Gothic", AppleGothic, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* --- THE BILLBOARD --- */
        #billboard {
            width: 950px;
            margin-top: 40px;
            background: var(--white);
            border: 12px solid var(--re-blue);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background-color: var(--re-red);
            color: white;
            text-align: center;
            padding: 25px;
            border-bottom: 8px solid var(--re-blue);
        }

        .header h1 {
            margin: 0;
            font-size: 36pt;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-container {
            display: grid;
            grid-template-columns: 600px 1fr;
            min-height: 400px;
        }

        /* Image Section */
        .photo-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .large-box {
            height: 380px;
            background: #eee;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .small-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .small-box {
            height: 182.5px;
            background: #eee;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        img { width: 100%; height: 100%; object-fit: cover; }

        /* Text Section */
        .details-text {
            padding: 25px 25px 25px 0;
            font-size: 14pt;
        }

        .details-text h2 { color: var(--re-blue); font-size: 24pt; margin: 0 0 10px 0; border-bottom: 2px solid #eee; }
        .details-text h3 { color: var(--re-red); font-size: 18pt; margin: 0 0 15px 0; }
        .details-text p { margin: 0; line-height: 1.6; color: #444; }

        /* Footer Icons */
        .footer-stats {
            background: var(--re-blue);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 22pt;
            font-weight: bold;
        }

        .stat-item { display: flex; align-items: center; gap: 15px; }

        /* --- CONTROL PANEL --- */
        .editor-panel {
            width: 950px;
            margin-top: 30px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            box-sizing: border-box;
            border: 1px solid #ddd;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: var(--re-blue); font-size: 0.9rem; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }

        .full-width { grid-column: span 3; border-top: 1px solid #eee; padding-top: 15px; text-align: center; color: #777; font-style: italic; }

    </style>
</head>
<body>

    <div id="billboard">
        <div class="header">
            <h1>Just Listed</h1>
        </div>

        <div class="main-container">
            <div class="photo-grid">
                <div class="large-box" id="view-main">Click Upload Below</div>
                <div class="small-stack">
                    <div class="small-box" id="view-s1">Pic 1</div>
                    <div class="small-box" id="view-s2">Pic 2</div>
                </div>
            </div>

            <div class="details-text">
                <h2 id="view-h">Property Headline</h2>
                <h3 id="view-sh">Subheading Details</h3>
                <p id="view-body">Your property description from the notepad file will appear here...</p>
            </div>
        </div>

        <div class="footer-stats">
            <div class="stat-item"><span>🛌</span> <span id="num-r">0</span></div>
            <div class="stat-item"><span>🛁</span> <span id="num-b">0</span></div>
            <div class="stat-item"><span>🚗</span> <span id="num-c">0</span></div>
        </div>
    </div>

    <div class="editor-panel">
        <div class="input-group">
            <label>Main Image (.jpg/.png)</label>
            <input type="file" accept="image/*" onchange="loadImg(this, 'view-main')">
        </div>
        <div class="input-group">
            <label>Small Image 1</label>
            <input type="file" accept="image/*" onchange="loadImg(this, 'view-s1')">
        </div>
        <div class="input-group">
            <label>Small Image 2</label>
            <input type="file" accept="image/*" onchange="loadImg(this, 'view-s2')">
        </div>

        <div class="input-group">
            <label>Property Text (.txt)</label>
            <input type="file" accept=".txt" onchange="loadTxt(this)">
        </div>

        <div class="input-group">
            <label>Rooms</label>
            <select onchange="updateStat('num-r', this.value)">
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option>
            </select>
        </div>
        <div class="input-group">
            <label>Baths</label>
            <select onchange="updateStat('num-b', this.value)">
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
            </select>
        </div>
        <div class="input-group">
            <label>Cars</label>
            <select onchange="updateStat('num-c', this.value)">
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
            </select>
        </div>

        <div class="full-width">
            Billboard Editor v1.0 - Use System Print (Ctrl+P) to save as PDF if needed.
        </div>
    </div>

    <script>
        // Update Icons/Stats
        function updateStat(id, val) {
            document.getElementById(id).innerText = val;
        }

        // Image Processing
        function loadImg(input, targetId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById(targetId);
                    box.innerHTML = `<img src="${e.target.result}">`;
                }
                reader.readAsDataURL(file);
            }
        }

        // Text File Processing
        function loadTxt(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l !== "");
                    if (lines[0]) document.getElementById('view-h').innerText = lines[0];
                    if (lines[1]) document.getElementById('view-sh').innerText = lines[1];
                    if (lines.length > 2) {
                        document.getElementById('view-body').innerText = lines.slice(2).join(" ");
                    }
                }
                reader.readAsText(file);
            }
        }
    </script>
</body>
</html>
