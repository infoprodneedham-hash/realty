<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Billboard Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --re-red: #d32f2f;
            --re-blue: #1976d2;
            --white: #ffffff;
        }

        body {
            font-family: "Century Gothic", AppleGothic, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* The Main Billboard Container */
        #billboard {
            width: 800px;
            background: var(--white);
            border: 10px solid var(--re-blue);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Header / Red Bar */
        .billboard-header {
            background-color: var(--re-red);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--re-blue);
        }

        /* Layout for Images and Text */
        .main-content {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .image-section {
            display: flex;
            flex: 1.5;
            gap: 10px;
        }

        .large-pic {
            flex: 2;
            height: 300px;
            background: #eee;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .small-pics-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .small-pic {
            height: 145px;
            background: #eee;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        img { width: 100%; height: 100%; object-fit: cover; }

        /* Text Section */
        .text-section {
            flex: 1;
            font-size: 14pt;
            color: #333;
            line-height: 1.4;
        }

        .text-section h1 { color: var(--re-blue); margin: 0 0 5px 0; font-size: 24pt; }
        .text-section h2 { color: var(--re-red); margin: 0 0 15px 0; font-size: 18pt; }

        /* Property Details Bar */
        .details-bar {
            background: var(--re-blue);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }

        /* Controls (Not visible in PDF) */
        .controls {
            margin-top: 30px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .upload-btn {
            display: block;
            background: #444;
            color: white;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        button.download-btn {
            grid-column: span 2;
            padding: 15px;
            background: var(--re-red);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="billboard">
        <div class="billboard-header">
            <h1>PREMIUM PROPERTY LISTING</h1>
        </div>

        <div class="main-content">
            <div class="image-section">
                <div class="large-pic" id="large-preview">Main Image</div>
                <div class="small-pics-col">
                    <div class="small-pic" id="small1-preview">Pic 1</div>
                    <div class="small-pic" id="small2-preview">Pic 2</div>
                </div>
            </div>

            <div class="text-section" id="text-display">
                <h1 id="out-h">Property Title</h1>
                <h2 id="out-sh">Property Subheading</h2>
                <p id="out-body">Upload a text file to populate this description. Ensure your file has a heading, subheading, and body text.</p>
            </div>
        </div>

        <div class="details-bar">
            <span>Rooms: <span id="val-rooms">0</span></span>
            <span>Bathrooms: <span id="val-baths">0</span></span>
            <span>Cars: <span id="val-cars">0</span></span>
        </div>
    </div>

    <div class="controls">
        <div>
            <label>Upload Main Image:</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'large-preview')">
        </div>
        <div>
            <label>Upload Text File (.txt):</label>
            <input type="file" accept=".txt" onchange="loadText(event)">
        </div>
        <div>
            <label>Small Image 1:</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'small1-preview')">
        </div>
        <div>
            <label>Small Image 2:</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'small2-preview')">
        </div>

        <div>
            <label>Rooms:</label>
            <select onchange="updateVal('val-rooms', this.value)">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option>
            </select>
        </div>
        <div>
            <label>Baths:</label>
            <select onchange="updateVal('val-baths', this.value)">
                <option>1</option><option>2</option><option>3</option><option>4+</option>
            </select>
        </div>
        <div>
            <label>Cars:</label>
            <select onchange="updateVal('val-cars', this.value)">
                <option>1</option><option>2</option><option>3</option><option>4+</option>
            </select>
        </div>

        <button class="download-btn" onclick="downloadPDF()">DOWNLOAD AS PDF</button>
    </div>

    <script>
        // Preview Images
        function previewImg(event, targetId) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById(targetId);
                output.innerHTML = `<img src="${reader.result}">`;
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // Load Text File
        function loadText(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const lines = reader.result.split('\n').filter(line => line.trim() !== "");
                if (lines.length >= 1) document.getElementById('out-h').innerText = lines[0];
                if (lines.length >= 2) document.getElementById('out-sh').innerText = lines[1];
                if (lines.length >= 3) document.getElementById('out-body').innerText = lines.slice(2).join(' ');
            };
            reader.readAsText(event.target.files[0]);
        }

        // Update Dropdown Values
        function updateVal(id, val) {
            document.getElementById(id).innerText = val;
        }

        // PDF Generation
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const billboard = document.getElementById('billboard');
            
            const canvas = await html2canvas(billboard, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            
            const pdf = new jsPDF('l', 'px', [canvas.width, canvas.height]);
            pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
            pdf.save("real-estate-billboard.pdf");
        }
    </script>
</body>
</html>
